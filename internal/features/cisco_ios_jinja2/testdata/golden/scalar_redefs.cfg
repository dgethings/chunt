hostname r1
!
banner motd ^Welcome to r1^
banner motd ^Authorized only^
!
ip domain-name old.example.com
ip domain-name new.example.com
!
enable secret 5 $1$abc$def
enable password letmein
!
router bgp 65001
 neighbor 10.0.0.1 remote-as 65002
 neighbor 10.0.0.1 remote-as 65003
 neighbor 10.0.0.1 description Uplink
!
interface GigabitEthernet0/0
 standby 1 priority 110
 standby 1 priority 120
!

crypto map CM1 10 ipsec-isakmp
 match address 101
!
crypto map CM1 10 ipsec-manual
!
crypto ipsec transform-set TS1 esp-aes esp-sha-hmac
!
crypto isakmp policy 10
 encryption aes
!
crypto isakmp profile PROF1
!
crypto ipsec profile IPP1
 set transform-set TS1
!
interface Tunnel0
 tunnel protection ipsec profile MISSING-IPP shared
!
zone security INSIDE
!
parameter-map type inspect PM1
 log-flow
!
policy-map type inspect PM-IN
 class type inspect CM1
  inspect
 !
 class type inspect-self
  pass
 !
!
class-map type inspect match-any CM1
 match protocol tcp
!
router bgp 65001
 neighbor PG1 peer-group
 neighbor 10.0.0.2 peer-group PG1
 neighbor 10.0.0.2 remote-as 65002
 neighbor 10.0.0.3 peer-group NOSUCH-PG
!
access-list 101 permit ip 10.0.0.0 255.0.0.0 any
!

! Jinja-aware definition/reference resolution (chunt-otg.21).
!
! Computed reference names ({{ ... }}) are unresolvable statically and must
! produce ZERO undefined-* diagnostics. A computed reference still resolves
! to a computed definition through normalized comparison (rule 4):
interface Gi0/0
 ip access-group {{ acl_name }} in
 ip policy route-map {{ egress_policy }}
 switchport access vlan {{ voice_vlan }}
!
! Mutually exclusive branches defining the same name are NOT duplicates,
! and guarded definitions satisfy references from any branch (rule 2):
{% if role == "core" %}
ip access-list extended EDGE-IN
 permit ip 10.0.0.0 255.0.0.0 any
!
{% else %}
ip access-list extended EDGE-IN
 permit ip 172.16.0.0 255.240.0.0 any
!
{% endif %}
! {% for %}-generated definitions register; computed duplicates are not
! flagged (rule 3):
{% for vlan_id in access_vlans %}
vlan {{ vlan_id }}
!
{% endfor %}
! Whitespace-control spellings normalize to the same key as plain {{ }}:
{% for acl in acls %}
ip access-list extended {{- acl_name -}}
 permit ip any any
!
{% endfor %}
! Literal misses inside guards are still flagged:
{% if enable_acl %}
line vty 0 4
 access-class TYPO_ACL in
!
{% endif %}
